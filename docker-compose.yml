# Cross-Agent Workspace
#   Plain HTTP on port 8080:       docker compose up -d --build
#   With automatic HTTPS (Caddy):  docker compose --profile https up -d --build   (needs CAW_DOMAIN in .env)
# The easiest way is scripts/docker-start.sh, which also creates .env with random passwords.

services:
  caw:
    build: .
    image: cross-agent-workspace:latest
    container_name: caw
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed inside the container; host-side port/bind are CAW_HOST_PORT / CAW_BIND.
      CAW_DATA_DIR: /data
      CAW_HOST: 0.0.0.0
      CAW_PORT: "8080"
    user: "${CAW_UID:-1000}:${CAW_GID:-1000}"
    volumes:
      - ./data:/data
    ports:
      - "${CAW_BIND:-0.0.0.0}:${CAW_HOST_PORT:-8080}:8080"

  caddy:
    image: caddy:2
    container_name: caw-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - caw
    environment:
      CAW_DOMAIN: ${CAW_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

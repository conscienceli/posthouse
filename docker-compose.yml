# Posthouse
#   Plain HTTP on port 8080:       docker compose up -d --build
#   With automatic HTTPS (Caddy):  docker compose --profile https up -d --build   (needs POSTHOUSE_DOMAIN in .env)
# The easiest way is scripts/docker-start.sh, which also creates .env with random passwords.

services:
  posthouse:
    build: .
    image: posthouse:latest
    container_name: posthouse
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed inside the container; host-side port/bind are POSTHOUSE_HOST_PORT / POSTHOUSE_BIND.
      POSTHOUSE_DATA_DIR: /data
      POSTHOUSE_HOST: 0.0.0.0
      POSTHOUSE_PORT: "8080"
    user: "${POSTHOUSE_UID:-1000}:${POSTHOUSE_GID:-1000}"
    volumes:
      - ./data:/data
    ports:
      - "${POSTHOUSE_BIND:-0.0.0.0}:${POSTHOUSE_HOST_PORT:-8080}:8080"

  caddy:
    image: caddy:2
    container_name: posthouse-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - posthouse
    environment:
      POSTHOUSE_DOMAIN: ${POSTHOUSE_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
